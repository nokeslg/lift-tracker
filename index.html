<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111114">
<title>Lift Tracker</title>
<style>
:root{--bg:#111114;--card:#1b1b20;--line:#2a2a31;--text:#ececf0;--mute:#8d8d99;--accent:#7dd3a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:80px}
header{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0;font-size:20px}
nav{display:flex;gap:8px;padding:12px 16px}
nav button,.day button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
nav button.on,.day button.on{background:var(--accent);color:#0b0b0d;border-color:var(--accent);font-weight:600}
.day{display:flex;gap:8px;padding:0 16px 12px}
.ex{margin:0 16px 12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.ex h3{margin:0 0 2px;font-size:17px}
.ex .meta{color:var(--mute);font-size:13px;margin-bottom:10px}
.ex .last{color:var(--accent);font-size:13px;margin-bottom:10px}
.set{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.set span{width:48px;color:var(--mute);font-size:13px}
input,select{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0f0f12;color:var(--text);font-size:16px}
.save{margin:4px 16px 16px;width:calc(100% - 32px);padding:14px;border-radius:12px;border:0;background:var(--accent);color:#0b0b0d;font-size:16px;font-weight:700}
.view{display:none}.view.on{display:block}
.chartbox{margin:0 16px 12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.chartbox h3{margin:0 0 8px;font-size:16px}
canvas{width:100%;height:140px}
.row{display:flex;gap:8px;margin-bottom:8px}
.settings{padding:0 16px}
.settings h3{margin:16px 0 6px}
.small{color:var(--mute);font-size:13px}
.btn2{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin-right:8px;margin-top:8px}
textarea{width:100%;height:90px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0f0f12;color:var(--text);font-size:14px}
</style>
</head>
<body>
<header><h1>Lift Tracker</h1></header>
<nav>
<button id="tabLog" class="on">Log</button>
<button id="tabProg">Progress</button>
<button id="tabSet">Settings</button>
</nav>

<div id="vLog" class="view on">
<div class="day" id="dayBtns"></div>
<div id="exList"></div>
<button class="save" id="saveBtn">Save workout</button>
</div>

<div id="vProg" class="view"><div id="charts"></div></div>

<div id="vSet" class="view"><div class="settings">
<h3>Band and cable labels</h3>
<div class="small">One per line, easiest first. Order sets the chart value.</div>
<textarea id="bandText"></textarea>
<button class="btn2" id="saveBands">Save labels</button>
<h3>Backup</h3>
<button class="btn2" id="exportBtn">Export data</button>
<button class="btn2" id="importBtn">Import data</button>
<textarea id="ioText" placeholder="Export shows here. Paste data here to import."></textarea>
</div></div>

<script>
const PLAN={
A:[
{n:"Incline DB press",t:"w",r:"6-12"},
{n:"Pull-ups (assisted or negatives)",t:"bw",r:"3-6"},
{n:"One-arm DB row",t:"w",r:"8-12 /side"},
{n:"Bulgarian split squat",t:"w",r:"8-12 /leg"},
{n:"Cable fly",t:"b",r:"12-15"},
{n:"Lateral raise",t:"w",r:"12-20"},
{n:"Ab wheel",t:"bw",r:"to failure"}],
B:[
{n:"DB overhead press",t:"w",r:"6-10"},
{n:"Feet-elevated push-ups",t:"bw",r:"to failure"},
{n:"Cable row",t:"b",r:"10-12"},
{n:"DB Romanian deadlift",t:"w",r:"10-12"},
{n:"Cable face pull",t:"b",r:"15-20"},
{n:"Lateral raise",t:"w",r:"12-20"},
{n:"Hanging leg raise / cable crunch",t:"bw",r:"to failure"}],
C:[
{n:"Incline DB press (variation)",t:"w",r:"6-12"},
{n:"Dips (lean forward)",t:"w",r:"5-8"},
{n:"Pull-ups or chin-ups",t:"bw",r:"3-6"},
{n:"Goblet squat / step-ups",t:"w",r:"10-15"},
{n:"Cable fly (high to low)",t:"b",r:"12-15"},
{n:"Reverse fly / cable lateral raise",t:"b",r:"12-20"},
{n:"Curls",t:"w",r:"12-15"},
{n:"Triceps pushdown",t:"b",r:"12-15"},
{n:"Ab wheel",t:"bw",r:"to failure"}]
};
const DEF_BANDS=["Light band","Medium band","Heavy band","Cable 1 pin","Cable 2 pins","Cable 3 pins","Cable 4 pins","Cable 5 pins"];
let store=JSON.parse(localStorage.getItem("lt")||"{}");
store.logs=store.logs||[];
store.bands=store.bands||DEF_BANDS;
let day="A";
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem("lt",JSON.stringify(store))}
function lastFor(name){
for(let i=store.logs.length-1;i>=0;i--){
const e=store.logs[i].entries.find(x=>x.n===name);
if(e)return e}
return null}
function fmt(e,t){
return e.sets.map(s=>{
if(t==="b")return (store.bands[s.w]||"?")+" x "+s.r;
if(t==="bw")return (s.w?"+"+s.w+" lb":"BW")+" x "+s.r;
return s.w+" lb x "+s.r}).join(", ")}
function renderDays(){
$("dayBtns").innerHTML="";
["A","B","C"].forEach(d=>{
const b=document.createElement("button");
b.textContent="Day "+d;
if(d===day)b.className="on";
b.onclick=()=>{day=d;renderDays();renderEx()};
$("dayBtns").appendChild(b)})}
function renderEx(){
const box=$("exList");box.innerHTML="";
PLAN[day].forEach((ex,i)=>{
const l=lastFor(ex.n);
const d=document.createElement("div");d.className="ex";
let h="<h3>"+ex.n+"</h3><div class='meta'>Target reps: "+ex.r+" | 2 sets to failure</div>";
if(l)h+="<div class='last'>Last: "+fmt(l,ex.t)+"</div>";
for(let s=0;s<2;s++){
h+="<div class='set'><span>Set "+(s+1)+"</span>";
if(ex.t==="b"){
h+="<select id='w"+i+"_"+s+"'>"+store.bands.map((b,k)=>"<option value='"+k+"'>"+b+"</option>").join("")+"</select>";
}else{
h+="<input id='w"+i+"_"+s+"' type='number' inputmode='decimal' placeholder='"+(ex.t==="bw"?"+lb (0=BW)":"lb")+"'>";
}
h+="<input id='r"+i+"_"+s+"' type='number' inputmode='numeric' placeholder='reps'></div>";
}
d.innerHTML=h;box.appendChild(d)})}
$("saveBtn").onclick=()=>{
const entries=[];
PLAN[day].forEach((ex,i)=>{
const sets=[];
for(let s=0;s<2;s++){
const w=$("w"+i+"_"+s).value,r=$("r"+i+"_"+s).value;
if(r!==""){sets.push({w:ex.t==="b"?parseInt(w):(parseFloat(w)||0),r:parseInt(r)})}}
if(sets.length)entries.push({n:ex.n,t:ex.t,sets})});
if(!entries.length){alert("Nothing to save yet.");return}
store.logs.push({date:new Date().toISOString(),day,entries});
persist();renderEx();alert("Saved.")};
function best(e){
return Math.max(...e.sets.map(s=>e.t==="b"?s.w*100+s.r:(s.w||0)*1000+s.r))}
function score(e){
// chart value: weight if weighted, else top reps for bodyweight, else band level
if(e.t==="w")return Math.max(...e.sets.map(s=>s.w));
if(e.t==="b")return Math.max(...e.sets.map(s=>s.w))+1;
return Math.max(...e.sets.map(s=>s.r))}
function renderCharts(){
const box=$("charts");box.innerHTML="";
const names={};
store.logs.forEach(l=>l.entries.forEach(e=>{
(names[e.n]=names[e.n]||{t:e.t,pts:[]}).pts.push({d:l.date,v:score(e)})}));
const keys=Object.keys(names);
if(!keys.length){box.innerHTML="<div class='small' style='padding:16px'>Log a workout to see progress.</div>";return}
keys.forEach(k=>{
const c=document.createElement("div");c.className="chartbox";
const lab=names[k].t==="w"?"top weight (lb)":names[k].t==="b"?"band level (higher = harder)":"top reps";
c.innerHTML="<h3>"+k+"</h3><div class='small'>"+lab+"</div><canvas></canvas>";
box.appendChild(c);
draw(c.querySelector("canvas"),names[k].pts)})}
function draw(cv,pts){
const r=window.devicePixelRatio||1;
const W=cv.clientWidth,H=cv.clientHeight;
cv.width=W*r;cv.height=H*r;
const x=cv.getContext("2d");x.scale(r,r);
const vs=pts.map(p=>p.v);
let mn=Math.min(...vs),mx=Math.max(...vs);
if(mn===mx){mn-=1;mx+=1}
const pad=14;
x.strokeStyle="#7dd3a8";x.lineWidth=2;x.beginPath();
pts.forEach((p,i)=>{
const px=pts.length===1?W/2:pad+i*(W-2*pad)/(pts.length-1);
const py=H-pad-(p.v-mn)/(mx-mn)*(H-2*pad);
i?x.lineTo(px,py):x.moveTo(px,py)});
x.stroke();
x.fillStyle="#7dd3a8";
pts.forEach((p,i)=>{
const px=pts.length===1?W/2:pad+i*(W-2*pad)/(pts.length-1);
const py=H-pad-(p.v-mn)/(mx-mn)*(H-2*pad);
x.beginPath();x.arc(px,py,3.5,0,7);x.fill()})}
function show(v){
["Log","Prog","Set"].forEach(n=>{
$("v"+n).classList.toggle("on",n===v);
$("tab"+n).classList.toggle("on",n===v)});
if(v==="Prog")renderCharts();
if(v==="Set")$("bandText").value=store.bands.join("\n")}
$("tabLog").onclick=()=>show("Log");
$("tabProg").onclick=()=>show("Prog");
$("tabSet").onclick=()=>show("Set");
$("saveBands").onclick=()=>{
const b=$("bandText").value.split("\n").map(s=>s.trim()).filter(Boolean);
if(b.length){store.bands=b;persist();renderEx();alert("Labels saved.")}};
$("exportBtn").onclick=()=>{$("ioText").value=JSON.stringify(store)};
$("importBtn").onclick=()=>{
try{const d=JSON.parse($("ioText").value);
if(d.logs){store=d;store.bands=store.bands||DEF_BANDS;persist();renderEx();alert("Imported.")}}
catch(e){alert("That did not parse.")}};
renderDays();renderEx();
</script>
</body>
</html>
